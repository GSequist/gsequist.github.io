<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="A large glossy black sphere at the center — a model sealed inside its own box — with three faint elliptical orbits crossing through it like the atomic symbol, slowly turning. Smaller spheres of the same kind sit around it, each a smaller copy of the same core with its own faint ring, spawned from it along thin radial lines. Two of the smaller spheres are joined by a direct line with a small pulse travelling back and forth between them, messaging each other and bypassing the center. One small sphere spawns an even smaller one below it. A soft shadow sits beneath the whole arrangement.">

  <style>
    .rings { transform-box: view-box; transform-origin: 500px 500px; animation: spin 90s linear infinite; }
    .core { transform-box: fill-box; transform-origin: center; animation: breathe 5.5s ease-in-out infinite; }
    .child { transform-box: fill-box; transform-origin: center; animation: breathe var(--dur, 5.5s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
    .pulse { animation: travel var(--speed, 2.6s) ease-in-out infinite alternate; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .rings, .core, .child { animation: none; }
      .pulse { display: none; }
    }
  </style>

  <rect x="0" y="0" width="1000" height="1000" fill="#f7f5f0"/>

  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="28%" stop-color="#161616" />
      <stop offset="65%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="softer" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- ground plane -->
  <ellipse cx="500" cy="955" rx="420" ry="26" fill="rgba(10,10,10,0.06)" filter="url(#soft)" />

  <g class="rings" fill="none">
    <ellipse cx="500" cy="500" rx="340" ry="150" stroke="rgba(10,10,10,0.34)" stroke-width="1.6" transform="rotate(0 500 500)" />
    <ellipse cx="500" cy="500" rx="340" ry="150" stroke="rgba(10,10,10,0.15)" stroke-width="1.6" transform="rotate(60 500 500)" />
    <ellipse cx="500" cy="500" rx="340" ry="150" stroke="rgba(10,10,10,0.15)" stroke-width="1.6" transform="rotate(120 500 500)" />

    <!-- spawn lines: parent -> direct children -->
    <path d="M422.5,462.8 L278.85,393.85" stroke="rgba(10,10,10,0.10)" stroke-width="1.4" />
    <path d="M571.99,452.93 L734.88,346.42" stroke="rgba(10,10,10,0.10)" stroke-width="1.4" />
    <!-- spawn line: child -> grandchild -->
    <path d="M784.64,668.44 L660.24,817.71" stroke="rgba(10,10,10,0.10)" stroke-width="1.4" />

    <!-- peer line: direct messaging between two children, no parent involved -->
    <path d="M763.72,359.77 L797.02,626.18" stroke="rgba(10,10,10,0.34)" stroke-width="1.4" />
    <circle class="pulse" r="5" fill="#0a0a0a" style="offset-path: path('M763.72,359.77 L797.02,626.18'); --speed: 2.6s;" />
    <circle class="pulse" r="3.4" fill="#0a0a0a" opacity="0.55" style="offset-path: path('M797.02,626.18 L763.72,359.77'); --speed: 2.6s;" />

    <!-- children: each a smaller copy of the same core, with its own faint ring -->
    <g class="child" style="--dur: 6s; --delay: 0s;">
      <ellipse cx="250" cy="380" rx="50" ry="50" fill="none" stroke="rgba(10,10,10,0.15)" stroke-width="1.2" />
      <circle cx="250" cy="380" r="32" fill="url(#ball)" />
      <ellipse cx="238" cy="368" rx="7" ry="4" fill="#ffffff" opacity="0.85" filter="url(#softer)" />
    </g>

    <g class="child" style="--dur: 5s; --delay: -2s;">
      <ellipse cx="760" cy="330" rx="46" ry="46" fill="none" stroke="rgba(10,10,10,0.15)" stroke-width="1.2" />
      <circle cx="760" cy="330" r="30" fill="url(#ball)" />
      <ellipse cx="749" cy="319" rx="6.5" ry="3.6" fill="#ffffff" opacity="0.85" filter="url(#softer)" />
    </g>

    <g class="child" style="--dur: 5.5s; --delay: -4s;">
      <ellipse cx="800" cy="650" rx="38" ry="38" fill="none" stroke="rgba(10,10,10,0.15)" stroke-width="1.2" />
      <circle cx="800" cy="650" r="24" fill="url(#ball)" />
      <ellipse cx="791" cy="641" rx="5.2" ry="3" fill="#ffffff" opacity="0.85" filter="url(#softer)" />
    </g>

    <g class="child" style="--dur: 4.5s; --delay: -1s;">
      <ellipse cx="650" cy="830" rx="26" ry="26" fill="none" stroke="rgba(10,10,10,0.15)" stroke-width="1.2" />
      <circle cx="650" cy="830" r="16" fill="url(#ball)" />
      <ellipse cx="645" cy="825" rx="3.4" ry="2" fill="#ffffff" opacity="0.85" filter="url(#softer)" />
    </g>
  </g>

  <g class="core">
    <circle cx="500" cy="500" r="86" fill="url(#ball)" />
    <ellipse cx="470" cy="463" rx="16" ry="9" fill="#ffffff" opacity="0.9" filter="url(#soft)" />
  </g>
</svg>
