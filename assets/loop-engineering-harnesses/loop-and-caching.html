<title>the loop</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #17130F;
    --muted: #6B6459;
    --line: #E4E0D8;
    --accent: #BFCDB6;
    --accent-line: #4F5F45;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(2rem, 4.5vw, 4.5rem);
    gap: 2rem;
  }

  header { display: flex; align-items: center; gap: 0.6rem; }

  .num {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .swatch {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border: 1px solid var(--accent-line);
    flex: none;
  }

  .title {
    margin: 0;
    font-weight: 200;
    font-size: clamp(2.5rem, 6vw, 3.75rem);
    letter-spacing: 0.01em;
    color: var(--ink);
    text-transform: lowercase;
  }

  .titlewrap { display: flex; flex-direction: column; gap: 0.5rem; }
  .rule { display: flex; align-items: center; gap: 0.6rem; }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .stage svg {
    width: 100%;
    max-width: 760px;
    height: auto;
    overflow: visible;
  }

  .container-box { fill: none; stroke: var(--ink); stroke-width: 1.25; }
  .divider { stroke: var(--line); stroke-width: 1.25; }
  .accent-fill { fill: var(--accent); stroke: var(--accent-line); stroke-width: 1.25; }
  .reg { stroke: var(--muted); stroke-width: 1; }

  .cell-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    fill: var(--muted);
    text-anchor: middle;
  }
  .cell-label.on-accent { fill: var(--ink); }
  .cell-label.main { font-size: 11px; }

  .dim-line { stroke: var(--ink); stroke-width: 1; }
  .dim-tick { stroke: var(--ink); stroke-width: 1; }
  .dim-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    fill: var(--muted);
    text-anchor: middle;
    text-transform: uppercase;
  }

  footer { display: flex; justify-content: center; }

  .caption {
    max-width: 40ch;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.5;
    color: var(--ink);
    text-wrap: balance;
  }
</style>

<body>
  <header>
    <div class="num">01</div>
  </header>

  <div class="titlewrap" style="margin-top:-2rem;">
    <div class="rule"><span class="swatch"></span><h1 class="title">the loop</h1></div>
  </div>

  <div class="stage">
    <svg viewBox="0 0 760 320" role="img" aria-label="Five cells tracing one turn's context: a fixed system prompt, three already-cached turns, and the new turn appended at the end, the only cell filled and the only safe place for new tokens to land. Below, the same five columns exploded into two more rows: prepending breaks all five, mid-inserting keeps only the first three.">

      <!-- group labels: what never changes vs. what grows -->
      <text class="dim-label" x="148" y="48">FIXED &#183; NEVER CHANGES</text>
      <text class="dim-label" x="438" y="48">GROWING TAIL &#183; APPENDED EACH TURN</text>

      <!-- flow chevrons in each gap -->
      <path class="container-box" d="M202,109 L210,115 L202,121" fill="none" />
      <path class="container-box" d="M318,109 L326,115 L318,121" fill="none" />
      <path class="container-box" d="M434,109 L442,115 L434,121" fill="none" />
      <path class="container-box" d="M550,109 L558,115 L550,121" fill="none" />

      <!-- landing-point annotations, kept clear of the corner crosshairs -->
      <text class="cell-label" x="175" y="180">PREPEND BREAKS ALL 5</text>
      <text class="cell-label" x="420" y="180">MID-INSERT BREAKS THE REST</text>

      <!-- cell 1: fixed system prompt -->
      <rect class="container-box" x="98" y="60" width="100" height="110" />
      <text class="cell-label main" x="148" y="82">SYSTEM</text>
      <text class="cell-label" x="148" y="106">PROMPT + TOOLS</text>
      <text class="cell-label" x="148" y="128">SET ONCE</text>

      <!-- cell 2: turn 1, already cached -->
      <rect class="container-box" x="214" y="60" width="100" height="110" />
      <text class="cell-label main" x="264" y="82">TURN 1</text>
      <text class="cell-label" x="264" y="106">USER + REPLY</text>
      <text class="cell-label" x="264" y="128">CACHED</text>

      <!-- cell 3: turn 2, already cached -->
      <rect class="container-box" x="330" y="60" width="100" height="110" />
      <text class="cell-label main" x="380" y="82">TURN 2</text>
      <text class="cell-label" x="380" y="106">USER + REPLY</text>
      <text class="cell-label" x="380" y="128">CACHED</text>

      <!-- cell 4: turn 3, already cached -->
      <rect class="container-box" x="446" y="60" width="100" height="110" />
      <text class="cell-label main" x="496" y="82">TURN 3</text>
      <text class="cell-label" x="496" y="106">USER + REPLY</text>
      <text class="cell-label" x="496" y="128">CACHED</text>

      <!-- cell 5: the new turn, the one accent element -->
      <rect class="accent-fill" x="562" y="60" width="100" height="110" />
      <text class="cell-label on-accent main" x="612" y="82">NEW</text>
      <text class="cell-label on-accent" x="612" y="106">APPENDED HERE</text>
      <text class="cell-label on-accent" x="612" y="128">ONLY SAFE SPOT</text>

      <!-- registration crosshairs, ~14px outside the (98,60)-(662,170) bounding box -->
      <g class="reg">
        <path d="M84,46 v14 M77,53 h14" />
        <path d="M676,46 v14 M669,53 h14" />
        <path d="M84,170 v14 M77,177 h14" />
        <path d="M676,170 v14 M669,177 h14" />
      </g>

      <!-- dimension line -->
      <line class="dim-line" x1="98" y1="190" x2="662" y2="190" />
      <line class="dim-tick" x1="98" y1="184" x2="98" y2="196" />
      <line class="dim-tick" x1="662" y1="184" x2="662" y2="196" />
      <text class="dim-label" x="380" y="211">5 CELLS &#183; 1 ACCENT</text>

      <!-- exploded view: what the same 5 columns look like under prepend and mid-insert -->
      <text class="dim-label" x="380" y="238">PREPEND &#183; 0 OF 5 CACHED</text>
      <rect class="container-box" x="98" y="244" width="100" height="16" />
      <rect class="container-box" x="214" y="244" width="100" height="16" />
      <rect class="container-box" x="330" y="244" width="100" height="16" />
      <rect class="container-box" x="446" y="244" width="100" height="16" />
      <rect class="container-box" x="562" y="244" width="100" height="16" />

      <text class="dim-label" x="380" y="284">MID-INSERT &#183; 3 OF 5 CACHED</text>
      <rect class="accent-fill" x="98" y="290" width="100" height="16" />
      <rect class="accent-fill" x="214" y="290" width="100" height="16" />
      <rect class="accent-fill" x="330" y="290" width="100" height="16" />
      <rect class="container-box" x="446" y="290" width="100" height="16" />
      <rect class="container-box" x="562" y="290" width="100" height="16" />

    </svg>
  </div>

  <footer>
    <p class="caption">The tail is the only place new tokens are safe; insert anywhere before it and the prefix stops matching.</p>
  </footer>
</body>
